name: Build and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to CurseForge, Modrinth, and GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: invex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read and validate release version
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: python3 scripts/release_notes.py --github-output "$GITHUB_OUTPUT"
      - name: Check release-note handling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Configure Java toolchains
        run: |
          echo "JDK17=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "JDK21=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build both Minecraft targets
        run: ./gradlew build --console=plain
      - name: Validate and stage release files
        run: python3 scripts/prepare_release.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: invex-jars
          path: build/release/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.20.1', '1.21.1']
        include:
          - minecraft: '1.20.1'
            java: '17'
          - minecraft: '1.21.1'
            java: '21'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: invex-jars
          path: build/release
      - name: Publish with MC Publish
        uses: Kir-Antipov/mc-publish@v3.3.2
        with:
          modrinth-id: g1ph7wAM
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1584857
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/release/invex-${{ needs.build.outputs.version }}-${{ matrix.minecraft }}.jar
          name: ${{ needs.build.outputs.version }}+${{ matrix.minecraft }}-fabric
          version: ${{ needs.build.outputs.version }}+${{ matrix.minecraft }}-fabric
          version-type: release
          changelog-file: build/release/RELEASE-NOTES.md
          loaders: fabric
          environment: server
          game-versions: ${{ matrix.minecraft }}
          java: ${{ matrix.java }}
          dependencies: |
            fabric-api(required)
            fabric-language-kotlin(required)
          fail-mode: fail

  publish-github:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: invex-jars
          path: build/release
      - name: Publish GitHub release with both Minecraft targets
        uses: Kir-Antipov/mc-publish@v3.3.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ needs.build.outputs.tag }}
          github-commitish: ${{ github.sha }}
          github-prerelease: false
          files: |
            build/release/invex-${{ needs.build.outputs.version }}-1.20.1.jar
            build/release/invex-${{ needs.build.outputs.version }}-1.21.1.jar
          name: Inventory EX ${{ needs.build.outputs.version }}
          version: ${{ needs.build.outputs.version }}
          version-type: release
          changelog-file: build/release/RELEASE-NOTES.md
          fail-mode: fail
